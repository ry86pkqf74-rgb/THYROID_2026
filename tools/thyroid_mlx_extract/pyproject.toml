[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thyroid-mlx-extract"
version = "0.1.0"
description = "On-device MLX-based clinical text extraction for THYROID_2026"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - internal research use" }
authors = [{ name = "Logan Glosser" }]
dependencies = [
    "mlx-lm>=0.20.0",
    "outlines>=0.1.0",
    "pydantic>=2.5",
    "click>=8.1",
    "google-cloud-bigquery>=3.20",
    "pyarrow>=15.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "tqdm>=4.66",
    "tenacity>=8.2",
    "structlog>=24.1",
    "rich>=13.7",
    "scispacy>=0.5.4",
]

[project.optional-dependencies]
deid = [
    "philter-lite",  # not on PyPI under this name; install from GitHub if needed
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
vision = [
    "mlx-vlm>=0.0.15",
    "pillow>=10.0",
]
speech = [
    "openai-whisper>=20231117",
]

[project.scripts]
thyroid-mlx = "thyroid_mlx_extract.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/thyroid_mlx_extract"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
