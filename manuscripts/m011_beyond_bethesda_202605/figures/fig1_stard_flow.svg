<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 720" font-family="Helvetica,Arial,sans-serif">
  <style>
    .box{fill:#f4f6f8;stroke:#33576e;stroke-width:1.5;rx:6}
    .hl{fill:#dce8f0;stroke:#1f4e66;stroke-width:2}
    .excl{fill:#fbeeee;stroke:#9a4040;stroke-width:1.2}
    .t{font-size:13px;fill:#1f2d34}
    .tb{font-size:13px;font-weight:bold;fill:#13242c}
    .ti{font-size:12px;fill:#7a3030}
    .cap{font-size:15px;font-weight:bold;fill:#13242c}
    line{stroke:#33576e;stroke-width:1.5}
  </style>
  <text x="20" y="28" class="cap">Figure 1. M011 STARD cohort flow — "Beyond Bethesda?"</text>

  <rect class="box" x="200" y="50" width="360" height="50" rx="6"/>
  <text x="380" y="72" text-anchor="middle" class="tb">Surgical thyroid registry</text>
  <text x="380" y="90" text-anchor="middle" class="t">10,871 patients with final surgical pathology</text>

  <line x1="380" y1="100" x2="380" y2="135"/>
  <line x1="380" y1="118" x2="560" y2="118"/>
  <rect class="excl" x="560" y="100" width="190" height="60" rx="6"/>
  <text x="570" y="120" class="ti">Excluded — no preoperative</text>
  <text x="570" y="136" class="ti">FNA with mappable Bethesda</text>
  <text x="570" y="152" class="ti">(n = 5,806)</text>

  <rect class="box" x="200" y="135" width="360" height="50" rx="6"/>
  <text x="380" y="157" text-anchor="middle" class="tb">Preoperative FNA with Bethesda category</text>
  <text x="380" y="175" text-anchor="middle" class="t">5,065 patients</text>

  <line x1="380" y1="185" x2="380" y2="220"/>
  <line x1="380" y1="203" x2="560" y2="203"/>
  <rect class="excl" x="560" y="185" width="190" height="56" rx="6"/>
  <text x="570" y="205" class="ti">Excluded — no preoperative</text>
  <text x="570" y="221" class="ti">ultrasound nodule (n = 2,586)</text>

  <rect class="hl" x="200" y="220" width="360" height="56" rx="6"/>
  <text x="380" y="242" text-anchor="middle" class="tb">PRIMARY M011 COHORT — 2,479 patients</text>
  <text x="380" y="262" text-anchor="middle" class="t">preop US + preop Bethesda + surgical pathology</text>

  <line x1="380" y1="276" x2="380" y2="310"/>
  <rect class="box" x="120" y="310" width="240" height="64" rx="6"/>
  <text x="240" y="330" text-anchor="middle" class="tb">With ACR TI-RADS: 2,310</text>
  <text x="240" y="348" text-anchor="middle" class="t">Malignant 1,175 · Benign 1,237</text>
  <text x="240" y="365" text-anchor="middle" class="t">NIFTP 48 · borderline 19 (separate)</text>

  <rect class="box" x="400" y="310" width="240" height="64" rx="6"/>
  <text x="520" y="330" text-anchor="middle" class="tb">Clinically significant malignancy</text>
  <text x="520" y="348" text-anchor="middle" class="t">1,168 patients</text>
  <text x="520" y="365" text-anchor="middle" class="t">Incidental PTMC 235 (separate)</text>

  <line x1="380" y1="374" x2="380" y2="405"/>
  <rect class="hl" x="220" y="405" width="320" height="50" rx="6"/>
  <text x="380" y="427" text-anchor="middle" class="tb">Bethesda III/IV subgroup — 723</text>
  <text x="380" y="445" text-anchor="middle" class="t">Bethesda III = 434 · Bethesda IV = 289</text>

  <line x1="380" y1="455" x2="380" y2="486"/>
  <rect class="hl" x="220" y="486" width="320" height="50" rx="6"/>
  <text x="380" y="508" text-anchor="middle" class="tb">Molecular-tested Bethesda III/IV — 333</text>
  <text x="380" y="526" text-anchor="middle" class="t">Afirma / ThyroSeq, preoperative</text>

  <line x1="380" y1="536" x2="380" y2="566"/>
  <rect class="box" x="120" y="566" width="520" height="86" rx="6"/>
  <text x="380" y="586" text-anchor="middle" class="tb">Frame A — high-confidence nodule-linked frame</text>
  <text x="380" y="606" text-anchor="middle" class="t">US nodule → FNA/Bethesda (imaging_fna_linkage_v3) → patient pathology</text>
  <text x="380" y="624" text-anchor="middle" class="t">9,317 linked cohort rows; 3,904 high-confidence (exact/high/plausible tier)</text>
  <text x="380" y="642" text-anchor="middle" class="t">across 1,449 patients · molecular attached at patient level</text>

  <text x="20" y="690" class="t">Frame B (patient-level fallback) = the 2,479 primary cohort: highest-risk Bethesda, maximum TI-RADS,</text>
  <text x="20" y="708" class="t">any preoperative molecular result, patient-level final pathology. Primary analyses use Frame B.</text>
</svg>
