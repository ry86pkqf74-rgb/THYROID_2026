# THYROID_2026 LangChain Extraction Pipeline
# Docker Compose for local and server deployment
#
# Usage:
#   # Run with default domains (imaging, pathology, labs):
#   docker compose up
#
#   # Run specific domains:
#   docker compose run thyroid-extractor --domains vascular_invasion rai_detailed
#
#   # Run with LangSmith tracing:
#   LANGCHAIN_API_KEY=ls__xxx docker compose --profile traced up
#
#   # Run the legacy (non-LangChain) extractor:
#   docker compose run legacy-extractor --domains imaging

services:
  # ---------- LangChain pipeline (primary) ----------
  thyroid-extractor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: thyroid-langchain-extractor
    volumes:
      # Mount parquet input (read-only)
      - ../processed/remaining:/app/processed/remaining:ro
      # Mount output dir (read-write) -- checkpoints persist here
      - ../output:/app/output
      # Mount prompts if you want to hot-swap without rebuild
      - ../notes_extraction_new/prompts:/app/notes_extraction_new/prompts:ro
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:14b}
      # LangSmith tracing (optional)
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-thyroid-2026-extraction}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT:-https://api.smith.langchain.com}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 4G

  # ---------- Legacy pipeline (original script, no LangChain) ----------
  legacy-extractor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: thyroid-legacy-extractor
    entrypoint: ["python3", "scripts/run_extraction_split.py"]
    volumes:
      - ../processed/remaining:/app/processed/remaining:ro
      - ../output:/app/output
      - ../notes_extraction_new/prompts:/app/notes_extraction_new/prompts:ro
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
    profiles:
      - legacy

  # ---------- Multi-domain parallel workers ----------
  # Spin up multiple extractors for different domain groups
  worker-group-a:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: thyroid-worker-a
    command: ["--domains", "vascular_invasion", "rai_detailed", "recurrence_detailed"]
    volumes:
      - ../processed/remaining:/app/processed/remaining:ro
      - ../output:/app/output
      - ../notes_extraction_new/prompts:/app/notes_extraction_new/prompts:ro
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:14b}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-thyroid-2026-extraction}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - parallel

  worker-group-b:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: thyroid-worker-b
    command: ["--domains", "medication_management", "past_surgical_hx"]
    volumes:
      - ../processed/remaining:/app/processed/remaining:ro
      - ../output:/app/output
      - ../notes_extraction_new/prompts:/app/notes_extraction_new/prompts:ro
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:14b}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-thyroid-2026-extraction}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - parallel
