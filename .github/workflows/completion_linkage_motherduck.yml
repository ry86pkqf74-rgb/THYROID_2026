# Rebuild patient_completion_oed_path_linkage_v1 (+ md_ mirror) using repo secrets only.
# Secrets: MD_SA_TOKEN (preferred) and/or MOTHERDUCK — same as ci.yml motherduck-ci.
name: MotherDuck — completion linkage (107)

on:
  workflow_dispatch:

jobs:
  linkage:
    runs-on: ubuntu-latest
    env:
      MD_SA_TOKEN: ${{ secrets.MD_SA_TOKEN }}
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Assert MotherDuck token
        run: |
          python -c "
          from motherduck_client import get_token
          t = get_token(prefer_service_account=True)
          assert t, 'No token: add repo secrets MD_SA_TOKEN and/or MOTHERDUCK'
          print('OK: token from GitHub Actions secrets')
          "

      - name: Materialize patient_completion_oed_path_linkage_v1
        run: python scripts/107_global_completion_oed_path_linkage.py --md --sa
