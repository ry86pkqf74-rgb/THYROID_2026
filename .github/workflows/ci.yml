name: Dashboard CI — Hardened

# ─────────────────────────────────────────────────────────────────────────────
# THYROID_2026  CI  |  Updated 2026-03-14
#
# Job graph (simplified):
#   Parallel (no secrets): ruff-and-mypy (+ workflow YAML parse), multimodal-tests,
#     llm-extraction-gold (offline pytest: LLM goldens + registry + provenance + fleet parity).
#   lint-and-syntax (MotherDuck secrets) → downstream jobs:
#     motherduck-formalization (v2 formalization path: 116 dry-run → 112 --motherduck-check → 119),
#     v2-domain-validation (legacy), benchmark-regression (continue-on-error),
#     share-publication-check (legacy; tags / manual), promotion-gate (legacy script 91; tags),
#     md-live-release-audit-dryrun (124 --md --dry-run; tags / manual),
#     md-final-master-dryrun (126 --md --dry-run; workflow_dispatch only).
#
# Service-account token
# ─────────────────────
# Store automation token as GitHub secret MD_SA_TOKEN (preferred in CI).
# Interactive / fallback: MOTHERDUCK_TOKEN. Optional: JWT-shaped value in LOCAL_DB_PATH.
# Official env alias: motherduck_token (same precedence as MOTHERDUCK_TOKEN in get_token).
# Scripts use get_token(prefer_service_account=True) which prefers MD_SA_TOKEN.
#
# Read-scaling / Business read-only token (NOT used in this workflow):
#   MD_READ_SCALING_TOKEN / MOTHERDUCK_READ_SCALING_TOKEN — dashboard read replicas only.
#   CI jobs must remain on read/write tokens; connect_rw / promotion / validators reject
#   read-scaling-only environments (see motherduck_client.ReadScalingTokenForbiddenError).
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      # Core app + data path; also prompt/config/CI/test changes (blocking offline suite)
      - ".github/**"
      - "app/**"
      - "config/**"
      - "dashboard.py"
      - "llm_extraction/**"
      - "motherduck_client.py"
      - "prompts/**"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - "requirements.txt"
      - "scripts/**"
      - "tests/**"
      - "utils/**"
  pull_request:
    branches: [main]
  # Allow manual triggering for release promotion checks
  workflow_dispatch:
    inputs:
      run_share_check:
        description: "Run share publication check (legacy)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      run_md_live_release_dryrun:
        description: "Run MotherDuck live release audit dry-run (scripts/124 --md --dry-run)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      run_completion_linkage:
        description: "Rebuild patient_completion_oed_path_linkage_v1 on MotherDuck (script 107)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      run_md_final_master_dryrun:
        description: "Run final-master orchestrator dry-run (120 triage + 126 --md --dry-run)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      final_master_hydrate_from:
        description: "Repo-relative path to gate dir with manual_review_queue.csv (required for 126 dry-run)"
        required: false
        default: ""
        type: string
      final_master_decisions_csv:
        description: "Repo-relative path to promotion_review_decisions.csv (required for 126 dry-run)"
        required: false
        default: ""
        type: string
      run_multimodal_md_contract_gate:
        description: "MotherDuck: run 129→128 with --strict-release (writes mm_contract_dev; requires MD_SA_TOKEN)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

jobs:
  # ── Static Python: Ruff (pyflakes F) + Mypy (pyproject.toml); no secrets ───
  ruff-and-mypy:
    name: Ruff F-rules + Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install PyYAML

      - name: Validate GitHub Actions workflow YAML
        run: |
          python -c "
          from pathlib import Path
          import yaml
          for p in sorted(Path('.github/workflows').glob('*.yml')):
              yaml.safe_load(p.read_text(encoding='utf-8'))
              print('OK', p)
          "

      - name: Ruff — pyflakes-equivalent (F)
        run: |
          ruff check scripts app utils llm_extraction motherduck_client.py dashboard.py --select F

      - name: Mypy (scoped in pyproject.toml)
        run: mypy

      - name: Doc path integrity (studies/ + docs/ links)
        run: python scripts/check_doc_paths.py

  # ── Job 0: Offline extraction contracts (blocking; no MD / no LLM APIs) ──
  # Runs golden LLM parser tests plus registry, provenance, and fleet parity.
  # See tests/fixtures/llm_regression/README.md — no MotherDuck or live model calls.
  llm-extraction-gold:
    name: LLM extraction gold + offline contracts (blocking)
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ""
      OPENAI_API_KEY: ""
      OPENAI_API_KEY_ID: ""
      MD_SA_TOKEN: ""
      MOTHERDUCK_TOKEN: ""
      LOCAL_DB_PATH: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: pytest — offline extraction suite
        run: |
          python -m pytest \
            tests/test_llm_extraction_regression.py \
            tests/test_fact_provenance_contract.py \
            tests/test_registry_and_md_connect.py \
            tests/test_fleet_registry_parity.py \
            tests/test_120_review_queue_triage.py \
            -v --tb=short

  # ── Multimodal contract + imaging↔FNA linkage (offline DuckDB, no secrets) ─
  multimodal-tests:
    name: Multimodal contract tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: pytest — multimodal contract + IFNA linkage
        env:
          GITHUB_TOKEN: ""
          OPENAI_API_KEY: ""
        run: |
          python -m pytest \
            tests/test_multimodal_contract_mm_v1.py \
            tests/test_imaging_fna_linkage_mm_v1.py \
            tests/test_specimen_fhir_layer.py \
            tests/test_specimen_fhir_qa_diagnostics.py \
            tests/test_specimen_genomics_binding.py \
            -v --tb=short

  # ── Job 1: Static Analysis ─────────────────────────────────────────────────
  lint-and-syntax:
    name: Syntax / Lint
    runs-on: ubuntu-latest
    env:
      MD_SA_TOKEN: ${{ secrets.MD_SA_TOKEN }}
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      LOCAL_DB_PATH: ${{ secrets.LOCAL_DB_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check — dashboard.py
        run: python -m py_compile dashboard.py && echo "dashboard.py OK"

      - name: Syntax check — all scripts
        run: |
          fail=0
          for f in scripts/*.py app/*.py utils/*.py llm_extraction/*.py; do
            python -m py_compile "$f" 2>&1 || { echo "FAIL: $f"; fail=1; }
          done
          exit $fail

      - name: Import check
        run: python -c "import importlib.util; spec = importlib.util.spec_from_file_location('dashboard', 'dashboard.py'); print('Imports resolve OK')"

      - name: Smoke test — MotherDuck RO share
        run: |
          python -c "
          from motherduck_client import MotherDuckClient
          client = MotherDuckClient.for_env('prod', use_service_account=True)
          con = client.connect_ro_share()
          n = con.execute('SELECT COUNT(DISTINCT research_id) FROM master_cohort').fetchone()[0]
          assert n > 10000, f'Expected 11k+ patients, got {n}'
          print(f'RO share OK: {n:,} patients')
          con.close()
          "

      # ── Canonical table existence ─────────────────────────────────────────
      - name: Check canonical tables exist
        run: |
          python -c "
          from motherduck_client import MotherDuckClient, MotherDuckConfig, get_token
          assert get_token(prefer_service_account=True), 'No MotherDuck token (set MD_SA_TOKEN or MOTHERDUCK_TOKEN)'
          con = MotherDuckClient(MotherDuckConfig(use_service_account=True)).connect_rw()

          REQUIRED_TABLES = [
              'master_cohort',
              'manuscript_cohort_v1',
              'patient_analysis_resolved_v1',
              'episode_analysis_resolved_v1_dedup',
              'thyroid_scoring_py_v1',
              'analysis_cancer_cohort_v1',
              'operative_episode_detail_v2',
              'rai_treatment_episode_v2',
              'molecular_test_episode_v2',
              'survival_cohort_enriched',
              'streamlit_patient_header_v',
              'longitudinal_lab_canonical_v1',
          ]
          missing = []
          for tbl in REQUIRED_TABLES:
              try:
                  con.execute(f'SELECT 1 FROM {tbl} LIMIT 1')
              except Exception:
                  missing.append(tbl)
          con.close()
          if missing:
              print('MISSING CANONICAL TABLES:', missing)
              exit(1)
          print(f'All {len(REQUIRED_TABLES)} canonical tables exist')
          "

      # ── 11 canonical manuscript metrics ──────────────────────────────────
      - name: Canonical metric reproducibility
        run: |
          python -c "
          from motherduck_client import MotherDuckClient, MotherDuckConfig, get_token
          assert get_token(prefer_service_account=True), 'No MotherDuck token (set MD_SA_TOKEN or MOTHERDUCK_TOKEN)'
          con = MotherDuckClient(MotherDuckConfig(use_service_account=True)).connect_rw()

          METRICS = [
              ('surgical_cohort',    'SELECT COUNT(DISTINCT research_id) FROM master_cohort',                              10500, 12000),
              ('cancer_cohort',      'SELECT COUNT(*) FROM analysis_cancer_cohort_v1',                                      3900, 4300),
              ('manuscript_cohort',  'SELECT COUNT(*) FROM manuscript_cohort_v1',                                          10500, 11200),
              ('dedup_episodes',     'SELECT COUNT(*) FROM episode_analysis_resolved_v1_dedup',                             9000, 9800),
              # Distinct patients with a row carrying platform (Phase 11+ RAS propagation); ~10k not ~1k episodes
              ('molecular_tested',   'SELECT COUNT(DISTINCT research_id) FROM molecular_test_episode_v2 WHERE platform IS NOT NULL', 9000, 11500),
              ('rai_received',       'SELECT COUNT(DISTINCT research_id) FROM rai_treatment_episode_v2',                     700, 1000),
              ('tirads_patients',    'SELECT COUNT(*) FROM extracted_tirads_validated_v1',                                  3000, 4000),
              (\"braf_positive\", \"SELECT COUNT(DISTINCT research_id) FROM extracted_braf_recovery_v1 WHERE LOWER(TRIM(CAST(braf_status AS VARCHAR))) = 'positive'\", 350, 750),
              ('operative_episodes', 'SELECT COUNT(*) FROM operative_episode_detail_v2',                                    8000, 12000),
              ('survival_cohort',    'SELECT COUNT(*) FROM survival_cohort_enriched',                                      40000, 70000),
              ('scoring_patients',   'SELECT COUNT(*) FROM thyroid_scoring_py_v1',                                         10500, 11500),
          ]

          failures = []
          for name, sql, lo, hi in METRICS:
              try:
                  v = con.execute(sql).fetchone()[0]
                  if not (lo <= int(v) <= hi):
                      failures.append(f'{name}: {v} not in [{lo},{hi}]')
                  else:
                      print(f'  OK {name}: {int(v):,}')
              except Exception as e:
                  failures.append(f'{name}: ERROR {e}')
          con.close()
          if failures:
              print('METRIC FAILURES:', failures)
              exit(1)
          print(f'All {len(METRICS)} canonical metrics in range')
          "

      # ── Row multiplication check ──────────────────────────────────────────
      - name: No row multiplication in patient/episode tables
        run: |
          python -c "
          from motherduck_client import MotherDuckClient, MotherDuckConfig, get_token
          assert get_token(prefer_service_account=True), 'No MotherDuck token (set MD_SA_TOKEN or MOTHERDUCK_TOKEN)'
          con = MotherDuckClient(MotherDuckConfig(use_service_account=True)).connect_rw()

          dupl = con.execute('SELECT COUNT(*) - COUNT(DISTINCT research_id) FROM patient_analysis_resolved_v1').fetchone()[0]
          assert dupl == 0, f'patient_analysis_resolved_v1 has {dupl} duplicate research_ids'

          sur_dupl = con.execute('''
              SELECT COUNT(*) - COUNT(DISTINCT research_id || chr(30) || COALESCE(surgery_episode_id::VARCHAR, chr(31)))
              FROM episode_analysis_resolved_v1_dedup
          ''').fetchone()[0]
          assert sur_dupl == 0, f'episode_dedup has {sur_dupl} duplicate (patient,episode) pairs'

          mc_dupl = con.execute('SELECT COUNT(*) - COUNT(DISTINCT research_id) FROM manuscript_cohort_v1').fetchone()[0]
          assert mc_dupl == 0, f'manuscript_cohort_v1 has {mc_dupl} duplicate research_ids'

          print('Row multiplication check: PASS')
          con.close()
          "

      # ── Non-null thresholds for core columns ──────────────────────────────
      - name: Core columns non-null check
        run: |
          python -c "
          from motherduck_client import MotherDuckClient, MotherDuckConfig, get_token
          assert get_token(prefer_service_account=True), 'No MotherDuck token (set MD_SA_TOKEN or MOTHERDUCK_TOKEN)'
          con = MotherDuckClient(MotherDuckConfig(use_service_account=True)).connect_rw()

          checks = [
              ('manuscript_cohort_v1',              'research_id', 0.0),
              ('patient_analysis_resolved_v1',      'research_id', 0.0),
              ('episode_analysis_resolved_v1_dedup','research_id', 0.0),
              ('thyroid_scoring_py_v1',             'research_id', 0.0),
              ('operative_episode_detail_v2',       'research_id', 0.0),
          ]

          failures = []
          for tbl, col, max_pct in checks:
              row = con.execute(f'SELECT ROUND(100.0*COUNT(*) FILTER (WHERE {col} IS NULL)/NULLIF(COUNT(*),0),2) FROM {tbl}').fetchone()
              pct = float(row[0]) if row and row[0] is not None else 0.0
              if pct > max_pct:
                  failures.append(f'{tbl}.{col}: {pct}% null (max {max_pct}%)')
              else:
                  print(f'  OK {tbl}.{col}: {pct}% null')
          con.close()
          if failures:
              print('NULL FAILURES:', failures)
              exit(1)
          "

      # ── Dashboard critical-path query smoke tests ─────────────────────────
      - name: Dashboard critical path queries
        run: |
          python -c "
          from motherduck_client import MotherDuckClient, MotherDuckConfig, get_token
          assert get_token(prefer_service_account=True), 'No MotherDuck token (set MD_SA_TOKEN or MOTHERDUCK_TOKEN)'
          con = MotherDuckClient(MotherDuckConfig(use_service_account=True)).connect_rw()

          QUERIES = [
              ('streamlit_header',  'SELECT COUNT(*) FROM streamlit_patient_header_v',   10000),
              ('date_rescue',       'SELECT COUNT(*) FROM date_rescue_rate_summary',          1),
              ('scoring_t_stage',   'SELECT COUNT(*) FROM thyroid_scoring_py_v1 WHERE ajcc8_t_stage IS NOT NULL', 3000),
          ]

          failures = []
          for label, sql, min_rows in QUERIES:
              try:
                  v = con.execute(sql).fetchone()[0]
                  if int(v) < min_rows:
                      failures.append(f'{label}: {v} rows < {min_rows}')
                  else:
                      print(f'  OK {label}: {int(v):,} rows')
              except Exception as e:
                  failures.append(f'{label}: ERROR {e}')
          con.close()
          if failures:
              print('DASHBOARD FAILURES:', failures)
              exit(1)
          print('Dashboard smoke tests: PASS')
          "

      # ── NEW: Manuscript source-env check ─────────────────────────────────
      - name: Manuscript source-env verification
        run: |
          python -c "
          from motherduck_client import MotherDuckClient, MotherDuckConfig, get_token, resolve_database_for_env
          assert get_token(prefer_service_account=True), 'No MotherDuck token (set MD_SA_TOKEN or MOTHERDUCK_TOKEN)'
          con = MotherDuckClient(MotherDuckConfig(use_service_account=True)).connect_rw()
          db = con.execute('SELECT current_database()').fetchone()[0]
          expected = resolve_database_for_env('prod')
          assert db == expected, f'manuscript source => {db!r}, expected {expected!r}'
          print(f'Manuscript source DB: {db!r} — PASS')
          con.close()
          "

      # ── NEW: Release manifest freshness check (warn, non-blocking) ────────
      - name: Release manifest freshness
        run: |
          python -c "
          import json, subprocess, sys
          from pathlib import Path
          latest = Path('exports/release_manifests/LATEST_MANIFEST.json')
          if not latest.exists():
              print('WARN: No release manifest found (run scripts/96_release_manifest.py to generate)')
              sys.exit(0)
          m = json.loads(latest.read_text())
          print(f'Latest manifest: {m[\"manifest_id\"]}  status={m[\"overall_status\"]}  sha={m[\"git_sha\"]}')
          if m['overall_status'] == 'BLOCKED':
              print('WARN: Latest manifest is BLOCKED — check metrics before tagging a release')
          head = subprocess.check_output(['git','rev-parse','--short=7','HEAD'], text=True).strip()
          if m.get('git_sha','')[:7] != head:
              print(f'WARN: Manifest SHA {m[\"git_sha\"]} != HEAD {head} — re-run scripts/96_release_manifest.py')
          else:
              print('Manifest SHA matches HEAD — fresh')
          sys.exit(0)
          "
        continue-on-error: true

  # ── MotherDuck formalization path (116 dry-run → 112 G8 → 119) ────────────
  # Token resolution: MD_SA_TOKEN / MOTHERDUCK_TOKEN only (LOCAL_DB_PATH cleared).
  # Runners need processed/output/v2_parquets for G1/G8 (on-disk inventory); restore via DVC/artifact if absent on github-hosted.
  motherduck-formalization:
    name: MotherDuck formalization (116 → 112 → 119)
    runs-on: ubuntu-latest
    needs: [ruff-and-mypy, lint-and-syntax]
    env:
      MD_SA_TOKEN: ${{ secrets.MD_SA_TOKEN }}
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      LOCAL_DB_PATH: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Assert read/write MotherDuck token (secrets never echoed)
        run: |
          python -c "
          import os
          assert (os.environ.get('MD_SA_TOKEN') or os.environ.get('MOTHERDUCK_TOKEN')), (
              'Configure GitHub secret MD_SA_TOKEN and/or MOTHERDUCK_TOKEN for this job.'
          )
          print('MotherDuck token env present (values not printed).')
          "

      - name: Stage loader dry-run (fail-closed --md)
        run: python scripts/116_md_stage_loader.py --md --dry-run

      - name: Promotion gate with MotherDuck parity (112 --motherduck-check)
        run: |
          python scripts/112_v2_domain_promotion_gate.py \
            --v2-parquets-dir processed/output/v2_parquets \
            --db-path thyroid_master.duckdb \
            --motherduck-check \
            --run-label "ci_formalization_${{ github.run_id }}"

      - name: Formalization validate (fail-closed --md)
        run: python scripts/119_md_formalization_validate.py --md

  # ── Job 3a: V2 Domain Promotion Validation (legacy) ─────────────────────
  v2-domain-validation:
    name: V2 Domain Promotion Validation (legacy)
    runs-on: ubuntu-latest
    needs: lint-and-syntax
    env:
      MD_SA_TOKEN: ${{ secrets.MD_SA_TOKEN }}
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      LOCAL_DB_PATH: ${{ secrets.LOCAL_DB_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Registry validation
        run: |
          python -c "
          from llm_extraction.registry import load_registry, validate_registry
          reg = load_registry()
          errs = validate_registry(reg)
          print(f'Registry: {len(reg.domains)} domains, schema_version={reg.schema_version}')
          if errs:
              print('VALIDATION ERRORS:', errs)
              exit(1)
          print('Registry validation: PASS')
          "

      - name: V2 canonical table existence (MotherDuck)
        run: |
          python -c "
          from motherduck_client import MotherDuckClient, MotherDuckConfig, get_token
          assert get_token(prefer_service_account=True), 'No MotherDuck token'
          con = MotherDuckClient(MotherDuckConfig(use_service_account=True)).connect_rw()
          for tbl in ['canonical_extracted_fact_long_v2', 'canonical_fact_quarantine_v2']:
              try:
                  cnt = con.execute(f'SELECT COUNT(*) FROM {tbl}').fetchone()[0]
                  print(f'  OK {tbl}: {cnt:,} rows')
              except Exception as e:
                  print(f'  WARN {tbl}: {e}')
          con.close()
          "
        continue-on-error: true

      - name: QA schema existence check
        run: |
          python -c "
          from motherduck_client import MotherDuckClient, MotherDuckConfig, get_token
          assert get_token(prefer_service_account=True), 'No MotherDuck token'
          con = MotherDuckClient(MotherDuckConfig(use_service_account=True)).connect_rw()
          schemas = [r[0] for r in con.execute('SHOW SCHEMAS').fetchall()]
          print(f'Schemas: {schemas}')
          qa_tables = con.execute(
              \"SELECT table_name FROM information_schema.tables WHERE table_schema='qa' ORDER BY 1\"
          ).fetchall()
          print(f'QA tables: {[r[0] for r in qa_tables]}')
          con.close()
          "
        continue-on-error: true

  # ── Job 3b: Global OED vs path-synoptic completion linkage (manual only) ──
  # Uses GitHub secrets; refreshes MotherDuck tables only (no repo commits).
  completion-linkage-motherduck:
    name: Completion linkage — MotherDuck script 107 (legacy / manual ops)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_completion_linkage == 'true'
    needs: lint-and-syntax
    env:
      MD_SA_TOKEN: ${{ secrets.MD_SA_TOKEN }}
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      LOCAL_DB_PATH: ${{ secrets.LOCAL_DB_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Assert token present
        run: |
          python -c "
          from motherduck_client import get_token
          t = get_token(prefer_service_account=True)
          assert t, 'No MotherDuck token: set MD_SA_TOKEN or MOTHERDUCK_TOKEN (optional JWT in LOCAL_DB_PATH)'
          print('Token resolved (service-account precedence)')
          "

      - name: Run script 107 — materialize linkage tables
        run: |
          python scripts/107_global_completion_oed_path_linkage.py --md --sa

  # ── Job 4: Query Benchmark Regression (every push, non-blocking on missing baseline)
  benchmark-regression:
    name: Query Benchmark Regression
    runs-on: ubuntu-latest
    needs: lint-and-syntax
    env:
      MD_SA_TOKEN: ${{ secrets.MD_SA_TOKEN }}
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      LOCAL_DB_PATH: ${{ secrets.LOCAL_DB_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run benchmark suite
        run: |
          python scripts/92_query_benchmark.py \
            --md \
            --baseline exports/md_benchmark_20260314/benchmark_baseline.csv \
            --runs 3
        # Non-fatal: regressions print a summary but do not block the push.
        continue-on-error: true

      - name: Upload benchmark results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-${{ github.sha }}
          path: exports/md_benchmark_*/benchmark_results_*.csv
          retention-days: 30

  # ── Job 5: RO Share Publication Check (legacy; tagged releases + manual dispatch) ─
  share-publication-check:
    name: RO Share Publication Check (legacy)
    runs-on: ubuntu-latest
    needs: lint-and-syntax
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      github.event.inputs.run_share_check == 'true'
    env:
      MD_SA_TOKEN: ${{ secrets.MD_SA_TOKEN }}
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      LOCAL_DB_PATH: ${{ secrets.LOCAL_DB_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run share publication check
        run: |
          python scripts/94_share_publication_check.py \
            --sa \
            --no-count-check

  # ── Job 6: Promotion Gate — legacy script 91 (tagged releases only) ───────
  promotion-gate:
    name: Promotion Gate — legacy script 91 (qa → prod)
    runs-on: ubuntu-latest
    needs: [lint-and-syntax, share-publication-check]
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      MD_SA_TOKEN: ${{ secrets.MD_SA_TOKEN }}
