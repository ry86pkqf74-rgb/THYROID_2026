            --from qa \
            --to prod \
            --sa

  # ── Live release audit dry-run (formalization orchestrator; tags + manual) ─
  md-live-release-audit-dryrun:
    name: MotherDuck live release audit — dry-run (124)
    runs-on: ubuntu-latest
    needs: lint-and-syntax
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_md_live_release_dryrun == 'true')
    env:
      MD_SA_TOKEN: ${{ secrets.MD_SA_TOKEN }}
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      LOCAL_DB_PATH: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Assert read/write MotherDuck token
        run: |
          python -c "
          import os
          assert (os.environ.get('MD_SA_TOKEN') or os.environ.get('MOTHERDUCK_TOKEN')), (
              'Configure GitHub secret MD_SA_TOKEN and/or MOTHERDUCK_TOKEN for this job.'
          )
          print('MotherDuck token env present (values not printed).')
          "

      - name: Live release audit orchestrator (dry-run, fail-closed --md)
        run: python scripts/124_md_live_release_audit.py --md --dry-run

  # ── Final-master dry-run (126; workflow_dispatch only — does not replace 124) ─
  md-final-master-dryrun:
    name: Final master orchestrator — dry-run (126)
    runs-on: ubuntu-latest
    needs: lint-and-syntax
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_md_final_master_dryrun == 'true'
    env:
      MD_SA_TOKEN: ${{ secrets.MD_SA_TOKEN }}
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      LOCAL_DB_PATH: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Assert read/write MotherDuck token
        run: |
          python -c "
          import os
          assert (os.environ.get('MD_SA_TOKEN') or os.environ.get('MOTHERDUCK_TOKEN')), (
              'Configure GitHub secret MD_SA_TOKEN and/or MOTHERDUCK_TOKEN for this job.'
          )
          print('MotherDuck token env present (values not printed).')
          "

      - name: Require gate + decisions paths (fail-closed)
        env:
          HY: ${{ github.event.inputs.final_master_hydrate_from }}
          DC: ${{ github.event.inputs.final_master_decisions_csv }}
        run: |
          if [ -z "$HY" ] || [ -z "$DC" ]; then
            echo "::error::BLOCKER: Set workflow_dispatch inputs final_master_hydrate_from and final_master_decisions_csv (repo-relative paths)."
            exit 1
          fi
          if [ ! -d "$HY" ]; then
            echo "::error::BLOCKER: final_master_hydrate_from is not a directory: $HY"
            exit 1
          fi
          if [ ! -f "$HY/manual_review_queue.csv" ]; then
            echo "::error::BLOCKER: missing manual_review_queue.csv under $HY"
            exit 1
          fi
          if [ ! -f "$DC" ]; then
            echo "::error::BLOCKER: final_master_decisions_csv not found: $DC"
            exit 1
          fi

      - name: Review queue triage + final-master dry-run
        env:
          HY: ${{ github.event.inputs.final_master_hydrate_from }}
          DC: ${{ github.event.inputs.final_master_decisions_csv }}
        run: |
          python scripts/120_review_queue_triage.py --md --md-sa
          python scripts/126_final_master_release.py --md --md-sa --dry-run \
            --hydrate-mrq-from "$HY" \
            --decisions-csv "$DC"

  # ── Multimodal contract strict gate (MotherDuck; manual dispatch only) ────
  multimodal-md-contract-gate:
    name: Multimodal contract — MotherDuck strict gate (129→128)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_multimodal_md_contract_gate == 'true'
    needs: [multimodal-tests, ruff-and-mypy]
    env:
      MD_SA_TOKEN: ${{ secrets.MD_SA_TOKEN }}
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      LOCAL_DB_PATH: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Assert MotherDuck write token
        run: |
          python -c "
          import os
          assert os.environ.get('MD_SA_TOKEN') or os.environ.get('MOTHERDUCK_TOKEN'), (
              'Configure MD_SA_TOKEN or MOTHERDUCK_TOKEN for this job.'
          )
          print('MotherDuck token env present (values not printed).')
          "

      - name: 129 → 128 strict release (mm_contract_dev)
        run: |
          mkdir -p artifacts
          set -euo pipefail
          export MM_IFNA_OUTPUT_SCHEMA=mm_contract_dev
          python scripts/129_imaging_fna_linkage_mm_v1.py --md --sa \
            --contract-schema mm_contract_dev \
            --strict-release \
            --emit-ci-artifact artifacts/imaging_fna_linkage_gate.json
          python scripts/128_multimodal_contract_mm_v1.py --md --sa \
            --strict-release \
            --emit-ci-artifact artifacts/multimodal_release_gate.json

      - name: Upload gate artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: multimodal-md-strict-gate-${{ github.run_id }}
          path: |
            artifacts/imaging_fna_linkage_gate.json
            artifacts/multimodal_release_gate.json
          if-no-files-found: warn
          retention-days: 90
