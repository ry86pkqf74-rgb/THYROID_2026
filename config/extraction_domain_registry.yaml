# ──────────────────────────────────────────────────────────────────────────────
# LLM extraction pipeline metadata
# ──────────────────────────────────────────────────────────────────────────────
llm_extraction:
  runner: llm_extraction/run_extraction.py
  prompt_dir: llm_extraction/prompts
  default_prompt: prompts/lab_date_extraction_v1.txt
  operative_prompt: prompts/operative_note_extraction_v1.txt

# ──────────────────────────────────────────────────────────────────────────────
# Canonical outputs — v1 preserved, v2 adds new domains
# ──────────────────────────────────────────────────────────────────────────────
# Molecular assay union + precedence (note genetics vs structured ThyroSeq/Afirma):
#   SQL: scripts/sql/132_molecular_fact_lineage_views.sql
#   Runner: scripts/132_molecular_fact_lineage_views.py
#   Views: main.molecular_fact_long_v, main.molecular_results_unified_v (alias),
#          main.molecular_fact_lineage_qa_duplicate_candidates_v
# Note extractions remain fact_provenance_category=note_derived in canonical_extracted_fact_long_*;
# governed imports use assay_structured_import in the unified view.

canonical_outputs:
  fact_long_table_v1:
    duckdb_table: canonical_extracted_fact_long_v1
    parquet_path: processed/canonical_extracted_fact_long_v1.parquet
    materialize_script: scripts/103_fact_lineage_materialize.py
    domains: v1_only
  fact_long_table_v2:
    duckdb_table: canonical_extracted_fact_long_v2
    parquet_path: processed/canonical_extracted_fact_long_v2.parquet
    materialize_script: scripts/103_fact_lineage_materialize.py
    domains: all
  quarantine_table_v1:
    duckdb_table: canonical_fact_quarantine_v1
    parquet_path: processed/canonical_fact_quarantine_v1.parquet
    materialize_script: scripts/103_fact_lineage_materialize.py
    domains: v1_only
  quarantine_table_v2:
    duckdb_table: canonical_fact_quarantine_v2
    parquet_path: processed/canonical_fact_quarantine_v2.parquet
    materialize_script: scripts/103_fact_lineage_materialize.py
    domains: all
  runs_table:
    duckdb_table: note_extraction_runs
    parquet_path: processed/note_extraction_runs.parquet
    materialize_script: llm_extraction/run_extraction.py

# ──────────────────────────────────────────────────────────────────────────────
# Sub-prompt domains — child extraction keys that map back to a parent domain.
#
# The VastAI fleet and run_extraction_split.py run these as independent
# extraction keys, each producing its own parquet file.  At promotion time,
# these child parquets roll into the parent domain's canonical target.
#
# Every entry here MUST have a valid parent_domain (a key in `domains` above)
# and a prompt_file that exists on disk under llm_extraction/.
# ──────────────────────────────────────────────────────────────────────────────
sub_prompt_domains:
  recurrence_detailed:
    parent_domain: recurrence
    prompt_file: prompts/recurrence_detailed_extraction_v1.txt
    parquet_stem: note_entities_llm_recurrence_detailed

  complications_rln_laryngoscopy:
    parent_domain: complications
    prompt_file: prompts/complications_rln_laryngoscopy_extraction_v1.txt
    parquet_stem: note_entities_llm_complications_rln_laryngoscopy

  medication_management:
    parent_domain: medications
    prompt_file: prompts/medication_management_extraction_v1.txt
    parquet_stem: note_entities_llm_medication_management

  operative_details:
    parent_domain: operative_detail
    prompt_file: prompts/operative_details_extraction_v1.txt
    parquet_stem: note_entities_llm_operative_details

  operative_v2_enrichment:
    parent_domain: operative_detail
    prompt_file: prompts/operative_v2_enrichment_extraction_v1.txt
    parquet_stem: note_entities_llm_operative_v2_enrichment

  parathyroid_per_gland:
    parent_domain: parathyroid_detail
    prompt_file: prompts/parathyroid_per_gland_extraction_v1.txt
    parquet_stem: note_entities_llm_parathyroid_per_gland

  molecular_thyroseq_afirma:
    parent_domain: genetics
    prompt_file: prompts/molecular_thyroseq_afirma_extraction_v1.txt
    parquet_stem: note_entities_llm_molecular_thyroseq_afirma

# ──────────────────────────────────────────────────────────────────────────────
# Concordance audit artifacts: v2 LLM re-extractions of v1 domains.
# These exist for concordance analysis only and are NEVER promoted to main.
# ──────────────────────────────────────────────────────────────────────────────
concordance_audit_stems:
  - parquet_stem: note_entities_llm_complications
    parent_v1_domain: complications
    classification: concordance-audit
  - parquet_stem: note_entities_llm_genetics
    parent_v1_domain: genetics
    classification: concordance-audit
  - parquet_stem: note_entities_llm_medications
    parent_v1_domain: medications
    classification: concordance-audit
  - parquet_stem: note_entities_llm_problem_list
    parent_v1_domain: problem_list
    classification: concordance-audit
  - parquet_stem: note_entities_llm_procedures
    parent_v1_domain: procedures
    classification: concordance-audit
  - parquet_stem: note_entities_llm_staging
    parent_v1_domain: staging
    classification: concordance-audit
