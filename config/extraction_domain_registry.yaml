# Machine-readable map: extraction domain → Parquet stem → prompt / schema version.
# Primary pipeline: llm_extraction/ (regex + LLM). Expanded prompts: llm_extraction/prompts/.
#
# This file is the SINGLE SOURCE OF TRUTH for the extraction domain inventory.
# All downstream consumers (run_extraction, 02b_register, 09b_fabric, 103_fact_lineage)
# read from this registry rather than maintaining hardcoded domain lists.
